name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build for iOS and Mac Catalyst
        run: |
          xcodebuild build -scheme Bugfixes -destination 'generic/platform=iOS Simulator' -quiet
          xcodebuild build -scheme Bugfixes -destination 'generic/platform=macOS,variant=Mac Catalyst' -quiet
  update_release_draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
